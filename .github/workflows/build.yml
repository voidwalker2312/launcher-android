name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat .build-src/part1.b64 .build-src/part2.b64 .build-src/part3.b64 .build-src/part4.b64 .build-src/part5.b64 | tr -d '\n\r' | base64 --decode > BlackHoleWidget-source.zip
          echo "7de73e693d4fcf0158664dcec7e9b91ab250b504  BlackHoleWidget-source.zip" | sha1sum -c -
          unzip -q BlackHoleWidget-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BlackHoleWidget
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleWidget-debug
          path: BlackHoleWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
